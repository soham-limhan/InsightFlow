<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InsightFlow - Spreadsheet Editor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/spreadsheet.css') }}">
</head>
<body>
    <div class="spreadsheet-container">
        <div class="spreadsheet-header">
            <div class="header-left">
                <a href="{{ url_for('dashboard', session_id=session_id) }}" class="btn-back">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M19 12H5M12 19l-7-7 7-7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Back to Dashboard
                </a>
                <h1>Spreadsheet Editor</h1>
                <p class="filename">{{ filename }}</p>
            </div>
            <div class="spreadsheet-controls">
                <button class="btn-save" id="saveBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/>
                        <polyline points="17 21 17 13 7 13 7 21"/>
                        <polyline points="7 3 7 8 15 8"/>
                    </svg>
                    Save
                </button>
                <button class="btn-download" id="downloadBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    Download
                </button>
            </div>
        </div>

        <div class="spreadsheet-wrapper" id="spreadsheetWrapper">
            <div id="loadingOverlay" class="loading-overlay">
                <div class="loader"></div>
                <p>Loading spreadsheet data...</p>
            </div>
            <table class="spreadsheet" id="spreadsheetTable">
                <thead id="spreadsheetHead"></thead>
                <tbody id="spreadsheetBody"></tbody>
            </table>
        </div>
    </div>

    <div class="status-indicator" id="statusIndicator">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Ready</span>
    </div>

    <script>
        window.sessionId = "{{ session_id }}";
    </script>
    <script src="{{ url_for('static', filename='js/spreadsheet.js') }}"></script>
</body>
</html>
